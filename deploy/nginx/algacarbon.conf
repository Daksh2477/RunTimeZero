# AlgaCarbon — nginx site.
#
# Install:
#   sudo cp deploy/nginx/algacarbon.conf /etc/nginx/sites-available/algacarbon
#   sudo ln -sf /etc/nginx/sites-available/algacarbon /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is added afterwards by certbot, which rewrites this file in place:
#   sudo certbot --nginx -d algacarbon.itzzsuperrr.me
#
# Cloudflare must be set to "DNS only" (grey cloud) while certbot runs — the
# HTTP-01 challenge cannot reach the origin through the proxy — then switched
# back to Proxied afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name algacarbon.itzzsuperrr.me;

    client_max_body_size 1m;

    # The trailing slash on proxy_pass is load-bearing: it strips the /api
    # prefix, so /api/fleet reaches the API as /fleet. Without it the API sees
    # /api/fleet and returns 404.
    location /api/ {
        proxy_pass http://127.0.0.1:4300/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }
}
